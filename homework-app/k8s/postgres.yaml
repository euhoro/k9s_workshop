apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homework-postgres-data
  namespace: homework-todo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homework-postgres
  namespace: homework-todo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homework-postgres
  template:
    metadata:
      labels:
        app: homework-postgres
    spec:
      containers:
        - name: homework-postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: homework-postgres-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: homework-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: homework-postgres
  namespace: homework-todo
spec:
  type: ClusterIP
  selector:
    app: homework-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
