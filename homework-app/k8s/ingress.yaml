apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homework-todo
  namespace: homework-todo
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: homework-backend
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homework-frontend
                port:
                  number: 80
