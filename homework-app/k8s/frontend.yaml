apiVersion: apps/v1
kind: Deployment
metadata:
  name: homework-frontend
  namespace: homework-todo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: homework-frontend
  template:
    metadata:
      labels:
        app: homework-frontend
    spec:
      containers:
        - name: homework-frontend
          image: homework-todo-frontend:1.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: homework-frontend
  namespace: homework-todo
spec:
  type: ClusterIP
  selector:
    app: homework-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
