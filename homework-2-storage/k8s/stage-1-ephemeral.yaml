apiVersion: apps/v1
kind: Deployment
metadata:
  name: homework2-ephemeral-redis
  namespace: homework2-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homework2-ephemeral-redis
  template:
    metadata:
      labels:
        app: homework2-ephemeral-redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: homework2-ephemeral-redis
  namespace: homework2-storage
spec:
  type: ClusterIP
  selector:
    app: homework2-ephemeral-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
