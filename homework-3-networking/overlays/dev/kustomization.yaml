apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../k8s
namespace: homework3-dev
labels:
  - pairs:
      environment: dev
replicas:
  - name: homework3-server
    count: 1
  - name: homework3-backend
    count: 1
  - name: homework3-postgres
    count: 1
patches:
  - target:
      kind: Namespace
      name: homework3-networking
    patch: |-
      - op: replace
        path: /metadata/name
        value: homework3-dev
  - target:
      kind: Ingress
      name: homework3-server
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: homework3.dev.local
