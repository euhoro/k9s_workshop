apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homework3-server
  namespace: homework3-networking
spec:
  ingressClassName: traefik
  rules:
    - host: homework3.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homework3-server
                port:
                  number: 8088
