apiVersion: v1
kind: ConfigMap
metadata:
  name: homework3-server-content
  namespace: homework3-networking
data:
  index.html: |
    <!doctype html>
    <html>
      <head><title>Homework 3</title></head>
      <body>
        <h1>Homework 3: Kubernetes networking</h1>
        <p>This response came from the Nginx Deployment.</p>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homework3-server
  namespace: homework3-networking
spec:
  replicas: 2
  selector:
    matchLabels:
      app: homework3-server
  template:
    metadata:
      labels:
        app: homework3-server
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: content
          configMap:
            name: homework3-server-content
